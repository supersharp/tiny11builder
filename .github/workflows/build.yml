name: Build and package

on:
  push:
    branches:
      - main
      - winui-preview
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run tests
        run: dotnet test .\tests\Tiny11Builder.Core.Tests\Tiny11Builder.Core.Tests.csproj -c Release --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests\Tiny11Builder.Core.Tests\TestResults\*.trx
          if-no-files-found: warn

  package:
    needs: test
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build verified release archive
        run: .\scripts\package.ps1 -Architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@v4
        with:
          name: Tiny11Builder-win-${{ matrix.architecture }}
          path: |
            artifacts\release\*.zip
            artifacts\release\*.sha256
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Download all release packages
        uses: actions/download-artifact@v4
        with:
          pattern: Tiny11Builder-win-*
          path: artifacts/release
          merge-multiple: true
      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}